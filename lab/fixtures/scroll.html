<!doctype html><meta charset="utf-8"><title>fringeless-lab</title><style>html{background:#fff}body{margin:0 auto;max-width:1100px;font:15px/1.5 "Segoe UI",system-ui;color:#111;background:#fff}header{position:sticky;top:0;background:#eee;padding:12px}</style><header>Sticky header</header><main></main>
